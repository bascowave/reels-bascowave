<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&family=Instrument+Serif:ital@1&family=JetBrains+Mono:wght@500;700&display=swap" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="studio.js"></script>
<style>
  /* Formato "Editorial claro" @bascowave: fundo de papel com sombra de onda passando, linha pequena em serifa
     itálica (.kick) + palavra-chave grande em caixa alta com marca-texto azul (.key), cartões de interface
     brancos, cartões de capítulo "truque n de 4". Sem legenda palavra a palavra: o data-cap só dá o tempo da fala. */
  :root { --paper:#F4F3EF; --ink:#111114; --mute:#8A8F98; --hl:#34B5DF; --hl2:#2B99D1; --card:#FFFFFF; --line:#E3E2DC; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1920px; overflow:hidden; background:var(--paper); }
  #root { position:relative; width:1080px; height:1920px; overflow:hidden; background:var(--paper);
    font-family:'Sora', sans-serif; color:var(--ink); }
  .abs { position:absolute; }
  .mono { font-family:'JetBrains Mono', monospace; }
  .serif { font-family:'Instrument Serif', serif; font-style:italic; font-weight:400; }
  #sombra { position:absolute; inset:-200px; filter:blur(30px); opacity:.16; }
  .scene { position:absolute; inset:0; opacity:0; }
  .cap { display:none; }
  .kick { position:absolute; left:60px; right:60px; top:250px; text-align:center; font-size:46px; color:#5B606A; opacity:0; }
  .key { position:absolute; left:60px; right:60px; top:310px; text-align:center; font-size:108px; font-weight:800;
    letter-spacing:-.035em; line-height:1.02; text-transform:uppercase; opacity:0; }
  .key span { position:relative; display:inline; padding:0 14px; }
  .key .hl { position:absolute; left:0; top:12%; bottom:6%; width:0; background:var(--hl); z-index:-1; border-radius:4px; }
  .ill { position:absolute; left:0; right:0; top:760px; height:900px; }
  .pop { position:absolute; opacity:0; }
  .card { background:var(--card); border-radius:22px; box-shadow:0 18px 50px rgba(17,17,20,.10), 0 2px 6px rgba(17,17,20,.06); }
  .head { background:var(--ink); color:#fff; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:22px;
    letter-spacing:.06em; padding:14px 26px; border-radius:22px 22px 0 0; text-transform:uppercase; }
  .body { padding:30px 34px; font-size:36px; line-height:1.45; font-weight:500; }
  .code { font-family:'JetBrains Mono',monospace; font-size:34px; line-height:1.6; white-space:pre; }
  .mark { background:var(--hl); padding:0 6px; border-radius:3px; }
  .tag { background:var(--hl); color:var(--ink); font-family:'JetBrains Mono',monospace; font-weight:700; font-size:24px;
    padding:8px 16px; border-radius:8px; white-space:nowrap; }
  .risco { text-decoration:line-through; text-decoration-thickness:4px; color:var(--mute); }
  /* capítulo */
  .cap-n { font-size:330px; font-weight:800; letter-spacing:-.06em; line-height:1; }
  .cap-t { font-size:96px; font-weight:800; letter-spacing:-.03em; }
  #foot { left:0; right:0; top:1740px; display:flex; justify-content:center; align-items:center; gap:14px; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="40" data-width="1080" data-height="1920">
  <svg id="sombra" viewBox="0 0 1480 2320"><g id="ondas" fill="#014676">
    <path d="M-400 600 Q-100 450 200 600 T800 600 T1400 600 T2000 600 V760 Q1700 610 1400 760 T800 760 T200 760 T-400 760Z"/>
    <path d="M-400 1200 Q-100 1050 200 1200 T800 1200 T1400 1200 T2000 1200 V1360 Q1700 1210 1400 1360 T800 1360 T200 1360 T-400 1360Z"/>
    <path d="M-400 1800 Q-100 1650 200 1800 T800 1800 T1400 1800 T2000 1800 V1960 Q1700 1810 1400 1960 T800 1960 T200 1960 T-400 1960Z"/>
  </g></svg>

<!--CENAS-->

  <div id="foot" class="abs"><img src="media/logo.png" style="width:56px; height:56px; border-radius:50%;"><span style="font-size:26px; font-weight:700;">@bascowave</span></div>
</div>
<script>
  const S = STUDIO, root = S.root;
  const scenes = [...document.querySelectorAll('.scene')].map(el => {
    const s = +el.dataset.s, e = +el.dataset.e;
    const pops = [...el.querySelectorAll('.pop')].map(p => ({ p, at: s + +p.dataset.at,
      out: p.dataset.out ? s + +p.dataset.out : null, r: p.style.getPropertyValue('--r') || '0deg' }));
    const kicks = [...el.querySelectorAll('.kick')].map(x => ({ x, at: s + +(x.dataset.at || 0) }));
    const keys = [...el.querySelectorAll('.key')].map(x => {
      const span = x.querySelector('span'), hl = document.createElement('i'); hl.className = 'hl';
      if (span) span.prepend(hl);
      return { x, hl, at: s + +(x.dataset.at || 0.15), hlAt: s + +(x.dataset.hl || 0.45) };
    });
    const types = [...el.querySelectorAll('[data-type]')].map(x => {
      const html = x.innerHTML; x.innerHTML = '';
      return { x, html, at: s + +x.dataset.type, rate: +x.dataset.rate };
    });
    const grows = [...el.querySelectorAll('[data-grow]')].map(x => ({ x, at: s + +x.dataset.grow, to: +x.dataset.to,
      w: +(x.dataset.w || 812), to2: x.dataset.to2 ? +x.dataset.to2 : null, at2: s + +(x.dataset.at2 || 0) }));
    const fades = [...el.querySelectorAll('[data-fade]')].map(x => ({ x, at: s + +x.dataset.fade }));
    const marks = [...el.querySelectorAll('[data-mark]')].map(x => ({ x, at: s + +x.dataset.mark }));
    const strikes = [...el.querySelectorAll('[data-strike]')].map(x => ({ x, at: s + +x.dataset.strike }));
    return { el, s, e, pops, kicks, keys, types, grows, fades, marks, strikes };
  });
  function typed(html, nChars) {
    let out = '', c = 0, inTag = false;
    for (const ch of html) {
      if (ch === '<') inTag = true;
      if (inTag) { out += ch; if (ch === '>') inTag = false; continue; }
      if (c >= nChars) break; out += ch; c++;
    }
    return out;
  }
  const ondas = document.getElementById('ondas');

  S.play(function render(t) {
    ondas.style.transform = `translate(${Math.sin(t * 0.6) * 220}px, ${Math.sin(t * 0.4) * 70}px)`;
    scenes.forEach(sc => {
      const vis = S.seg(t, sc.s, 0.18, 'power2.out') - S.seg(t, sc.e - 0.15, 0.15, 'power2.in');
      sc.el.style.opacity = vis;
      if (vis <= 0) return;
      const k = Math.min(1, Math.max(0, (t - sc.s) / (sc.e - sc.s)));
      sc.el.querySelector('.ill').style.transform = `translateY(${-46 * k}px) scale(${1 + 0.10 * k})`;
      sc.kicks.forEach(o => { const p = S.seg(t, o.at, 0.4, 'power3.out'); o.x.style.opacity = p; o.x.style.transform = `translateY(${(1 - p) * 14}px)`; });
      sc.keys.forEach(o => {
        const p = S.seg(t, o.at, 0.45, 'back.out(1.6)');
        o.x.style.opacity = Math.min(1, Math.max(0, (t - o.at) / 0.12));
        o.x.style.transform = `scale(${0.88 + 0.12 * p})`;
        o.hl.style.width = (100 * S.seg(t, o.hlAt, 0.35, 'power2.inOut')) + '%';
      });
      sc.pops.forEach(o => {
        const p = S.seg(t, o.at, 0.5, 'back.out(1.5)');
        let a = Math.min(1, Math.max(0, (t - o.at) / 0.15));
        if (o.out !== null) a *= 1 - S.seg(t, o.out, 0.15, 'power2.in');
        o.p.style.opacity = a;
        o.p.style.transform = `translateY(${(1 - p) * 40}px) scale(${0.9 + 0.1 * p}) rotate(${o.r})`;
      });
      sc.types.forEach(o => { o.x.innerHTML = typed(o.html, Math.max(0, Math.floor((t - o.at) * o.rate))); });
      sc.grows.forEach(o => {
        let v = o.to * S.seg(t, o.at, 0.8, 'power3.out');
        if (o.to2 !== null) v += (o.to2 - o.to) * S.seg(t, o.at2, 0.6, 'back.out(1.4)');
        o.x.style.width = (o.w * v) + 'px';
      });
      sc.fades.forEach(o => { o.x.style.opacity = S.seg(t, o.at, 0.3); });
      sc.marks.forEach(o => { o.x.style.background = t >= o.at ? 'var(--hl)' : 'transparent'; });
      sc.strikes.forEach(o => { o.x.classList.toggle('risco', t >= o.at); });
    });
  }, { loop: false });
  if (location.search.includes('play')) {
    document.documentElement.style.cssText += 'zoom:' + Math.min(innerWidth / 1080, innerHeight / 1920);
    window.__timelines.main.repeat(-1).play();
  }
</script>
</body>
</html>
